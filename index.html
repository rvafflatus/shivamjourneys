<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shivam Journeys | Explore Your Dream Destinations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0fdf4', 100: '#dcfce7', 600: '#16a34a', 700: '#15803d', 800: '#166534', 900: '#14532d' },
                        accent: { 500: '#f59e0b', 600: '#d97706' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

    <!-- Header Component -->
    <div id="include-header"></div>

    <!-- Hero Component -->
    <div id="include-hero"></div>

    <!-- Stats Component -->
    <div id="include-stats"></div>

    <!-- Domestic Tours Component -->
    <div id="include-domestic"></div>

    <!-- International Tours Component -->
    <div id="include-international"></div>

    <!-- About Component -->
    <div id="include-about"></div>

    <!-- Contact Component -->
    <div id="include-contact"></div>

    <!-- Footer Component -->
    <div id="include-footer"></div>

    <!-- Script to Load Components Dynamically -->
    <script>
        async function loadComponent(id, file) {
            try {
                let response = await fetch(file);
                if (response.ok) {
                    let html = await response.text();
                    document.getElementById(id).innerHTML = html;
                }
            } catch (error) {
                console.error("Error loading component:", file, error);
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await loadComponent('include-header', 'components/header.html');
            await loadComponent('include-hero', 'components/hero.html');
            await loadComponent('include-stats', 'components/stats.html');
            await loadComponent('include-domestic', 'components/domestic.html');
            await loadComponent('include-international', 'components/international.html');
            await loadComponent('include-about', 'components/about.html');
            await loadComponent('include-contact', 'components/contact.html');
            await loadComponent('include-footer', 'components/footer.html');

            // Re-bind mobile menu button after components load
            setTimeout(() => {
                const mobileMenuBtn = document.getElementById('mobile-menu-btn');
                const mobileMenu = document.getElementById('mobile-menu');
                if (mobileMenuBtn && mobileMenu) {
                    mobileMenuBtn.addEventListener('click', () => {
                        mobileMenu.classList.toggle('hidden');
                    });
                    mobileMenu.querySelectorAll('a').forEach(link => {
                        link.addEventListener('click', () => {
                            mobileMenu.classList.add('hidden');
                        });
                    });
                }
                const yearElement = document.getElementById('current-year');
                if (yearElement) {
                    yearElement.textContent = new Date().getFullYear();
                }
            }, 300);
        });
    </script>
    <script src="js/main.js"></script>
</body>
</html>
